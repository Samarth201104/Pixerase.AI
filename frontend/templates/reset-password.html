{% extends "base.html" %}
{% block title %}Reset Password — Pixerase.AI{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h2>Reset Password</h2>

    <form id="resetForm">

      <label>Email
        <input type="email" id="resetEmail" required>
      </label>

      <label>OTP
        <input type="text" id="resetOtp" required>
      </label>

      <label>New Password
        <input type="password" id="resetPassword" required>
      </label>

      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:12px;">
        Reset Password
      </button>

      <p id="resetMessage" class="muted" style="margin-top:14px;"></p>
    </form>
  </div>
</section>

<script src="/static/js/auth.js"></script>
{% endblock %}
