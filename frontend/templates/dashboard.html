{% extends "base.html" %}
{% block title %}Dashboard — Pixerase.AI{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h2>Your Dashboard</h2>
    <p class="muted">Welcome to your profile</p>

    <div style="margin-top:20px;">
      <p><strong>Name:</strong> <span id="dashName"></span></p>
      <p><strong>Email:</strong> <span id="dashEmail"></span></p>
    </div>

    <div style="margin-top:20px;">
      <a href="/background" class="btn btn-primary">Use Background Removal</a>
      <a href="/object" class="btn btn-outline" style="margin-left:10px;">Use Object Removal</a>
    </div>
  </div>
</section>

<script>
  const user = JSON.parse(localStorage.getItem("user_data"));

  if (!user) {
    window.location.href = "/login";
  } else {
    document.getElementById("dashName").innerText = user.name;
    document.getElementById("dashEmail").innerText = user.email;
  }
</script>
{% endblock %}
