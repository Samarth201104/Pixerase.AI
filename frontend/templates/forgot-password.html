{% extends "base.html" %}
{% block title %}Forgot Password — Pixerase.AI{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h2>Forgot Password</h2>
    <p class="muted">Enter your email to receive OTP</p>

    <form id="forgotForm">
      <label>Email
        <input type="email" id="forgotEmail" required>
      </label>

      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:12px;">
        Send OTP
      </button>

      <p id="forgotMessage" class="muted" style="margin-top:14px;"></p>
    </form>
  </div>
</section>

<script src="/static/js/auth.js"></script>
{% endblock %}
