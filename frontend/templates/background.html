{% extends "base.html" %}
{% block title %}Background Removal — Pixerase.AI{% endblock %}
{% block content %}

<section class="tool-page container">
  <div class="tool-left">
    <h2>Background Removal</h2>
    <p class="muted">Upload your image, remove background, apply template, then download.</p>

    <!-- Main Image Upload -->
    <div class="card upload-card">
      <label class="file-drop" id="bgDrop">
        <input id="bgFile" type="file" accept="image/*" hidden>
        <div class="drop-inner">
          <strong>Drag & drop</strong> or 
          <span class="linkish" id="bgSelect">Select an image</span>
          <p class="muted">PNG, JPG, JPEG, WebP</p>
        </div>
      </label>
    </div>

    <div class="input-box">
      <img id="beforeBg" style="display:none;" class="rect-image">
    </div>

    <div class="result-box">
      <img id="bgResult" style="display:none;" class="rect-image">
    </div>

    <div class="controls">
      <button id="removeBgOnlyBtn" class="btn btn-primary">Remove Background</button>
      <button id="replaceBgBtn" class="btn btn-secondary">Replace Background</button>
      <button id="clearBgBtn" class="btn btn-outline">Clear</button>
      <button id="downloadBgBtn" class="btn btn-ghost">Download</button>
    </div>


    <!-- -------- Templates ---------- -->
    <h3>Background Templates</h3>

    <div class="template-gallery">
      {% for t in templates %}
        <img
          src="{{ url_for('static', filename='backgrounds/' + t) }}"
          class="template-thumb selectable-template"
          data-name="{{ t }}"
        >
      {% endfor %}

      <label class="custom-upload">
        <input id="customBgFile" type="file" accept="image/*" hidden>
        + Upload custom background
      </label>
    </div>

    <!-- Hidden input for selected template -->
    <input type="hidden" id="bgTemplateSelect">

  </div>
</section>

<script src="{{ url_for('static', filename='js/background.js') }}"></script>
{% endblock %}
