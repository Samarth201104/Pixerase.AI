services:
  - type: web
    name: pixerase-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 180 run:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: FLASK_DEBUG
        value: "false"
      - key: MAX_UPLOAD_SIZE
        value: 26214400
      - key: MAX_IMAGE_PIXELS
        value: 12000000
      - key: CORS_ORIGINS
        value: https://pixeraseai.vercel.app
